[package]
name = "swissdocai-redact"
version = "0.1.0"
description = "SwissDocAI Redact: black out personal data in documents, on this computer"
authors = ["SwissDocAI"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "swissdocai_redact_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
