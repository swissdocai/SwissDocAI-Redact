# The desktop app's installers for Windows, macOS (Apple silicon) and Linux, built by
# installer/build.py. Run by hand (Actions → Installers → Run workflow) or by pushing a
# version tag (v0.2.0): the installers are attached to the run; for a tag also to a draft
# GitHub release.
name: Installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write  # the draft release for a tag

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-14  # Apple silicon
            bundles: dmg
          - os: ubuntu-22.04  # an older glibc: the AppImage runs on newer systems too
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true  # the Swiss recognizer, swissdocai/models/parseq_swiss.onnx

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Tauri's system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Signed and notarized only when the Apple Developer ID secrets are set (Tauri reads them);
      # unsigned, macOS asks users to allow the app under System Settings → Privacy & Security.
      - name: Apple signing
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        run: |
          {
            echo "APPLE_CERTIFICATE<<EOF"
            echo "${{ secrets.APPLE_CERTIFICATE }}"
            echo "EOF"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      - name: Build
        run: uv run --no-project python installer/build.py --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
